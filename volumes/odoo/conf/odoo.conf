[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
; Log to stdout (docker compose logs). Uncomment to use a file instead:
; logfile = /var/log/odoo/odoo-server.log
list_db = True
proxy_mode = False
workers = 0
; Disable cron during first DB init (avoids ir_module_module race). Set to 1 later if needed.
max_cron_threads = 0
; Windows/Docker Desktop: first database creation can take several minutes.
limit_time_cpu = 600
limit_time_real = 1200
without_demo = False
