[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
; Log to stdout (docker compose logs). Uncomment to use a file instead:
; logfile = /var/log/odoo/odoo-server.log
list_db = True
proxy_mode = False
workers = 0
max_cron_threads = 0
; Heavy apps (Accounting) need long CPU/real limits on Docker Desktop.
limit_time_cpu = 3600
limit_time_real = 3600
limit_memory_soft = 2684354560
limit_memory_hard = 4294967296
db_maxconn = 64
without_demo = True
